<!DOCTYPE html>
<html>

<head>
    <style>
        html,
        body {
            font-family: Arial, sans-serif;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        #map {
            height: 100%;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <script>
        var map;
        //function initMap() {
        //  // Constructor creates a new map - only center and zoom are required.
        //  map = new google.maps.Map(document.getElementById('map'), {
        //    center: {lat: 40.7413549, lng: -73.9980244},
        //    zoom: 13
        //  });
        //}

        function initMap() {
            // Define the LatLng coordinates for the polygon's path.
            var map = new google.maps.Map(document.getElementById('map'), {
                zoom: 10,
                center: {
                    lat: 34.022980,
                    lng: -117.900190
                },
                mapTypeId: 'terrain'
            });

            fetch('https://nominatim.openstreetmap.org/search.php?q=Corona+California+United+States&polygon_geojson=1&format=json')
                .then((res) => res.json())
                .then((res) => {
                    var city = res[0];
                    console.log(city.display_name);
                    coords = city.geojson.coordinates[0].map(c => ({
                        lat: c[1],
                        lng: c[0]
                    }));
                    //console.log(JSON.stringify(coords, null, 2))


                    // Construct the polygon.
                    var polygon = new google.maps.Polygon({
                        paths: coords,
                        strokeColor: '#FF0000',
                        strokeOpacity: 0.8,
                        strokeWeight: 2,
                        fillColor: '#FF0000',
                        fillOpacity: 0.35
                    });
                    polygon.setMap(map);
                });
        }
    </script>

    <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAaGsRExNit_9JAb_X2_oxRUwjgniApjSw&v=3&callback=initMap">
    </script>

</body>

</html>
