<!DOCTYPE html>
<html>

<head>
    <style>
        html,
        body {
            font-family: Arial, sans-serif;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        #map {
            height: 100%;
        }

    </style>
</head>

<body>
    <div id="map"></div>
    <script>
        var map;

        function api(city) {
            return `https://nominatim.openstreetmap.org/search.php?q=${city}+California+United+States&polygon_geojson=1&format=json`
        }

        function initMap() {
            // Define the LatLng coordinates for the polygon's path.
            var map = new google.maps.Map(document.getElementById('map'), {
                zoom: 10.5,
                center: {
                    lat: 33.989819,
                    lng: -117.594429
                },
                mapTypeId: 'terrain'
            });

            function draw(city, color) {
                fetch(api(city))
                    .then((res) => res.json())
                    .then((res) => {
                        coords = res[0].geojson.coordinates[0].map(c => ({
                            lat: c[1],
                            lng: c[0]
                        }));
                        if (city.includes('Covina')) {
                            coords = res[1].geojson.coordinates[0][0].map(c => ({ lat: c[1], lng: c[0] }));
                        }


                        // Construct the polygon.
                        var polygon = new google.maps.Polygon({
                            paths: coords,
                            strokeColor: color,
                            strokeOpacity: 0.8,
                            strokeWeight: 2,
                            fillColor: color,
                            fillOpacity: 0.35
                        });
                        polygon.setMap(map);
                    });

            }
            draw('Moreno+Valley', '#FF0000')
            draw('Covina', 'green')
            draw('Azusa', '#FF0000')
            draw('Arcadia', '#FF0000')
        }

    </script>

    <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAaGsRExNit_9JAb_X2_oxRUwjgniApjSw&v=3&callback=initMap">
    </script>

</body>

</html>
